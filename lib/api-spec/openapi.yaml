openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: checkout
    description: Checkout operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout-url:
    get:
      operationId: getCheckoutUrl
      tags: [checkout]
      summary: Get Stripe checkout URL
      description: Returns a cached Stripe checkout URL for the team's seeit.co course
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Applicant name
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "500":
          description: Failed to resolve URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CheckoutResult:
      type: object
      properties:
        checkoutUrl:
          type: string
        isDirect:
          type: boolean
      required:
        - checkoutUrl
        - isDirect
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
